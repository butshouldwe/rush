name: Publish

# Configure npm-release before enabling real publishes. See docs/NPM-RELEASE.md.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and inspect without publishing'
        type: boolean
        default: true

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      manifest: ${{ steps.pack.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: node common/scripts/install-run-rush.js install
      - run: node --test scripts/release-npm.test.mjs
      - run: node common/scripts/install-run-rush.js build --only @butshouldwe/config-rush --only @butshouldwe/fallow-rush --only @butshouldwe/sbom-rush
      - run: node common/scripts/install-run-rush.js publish-check --only @butshouldwe/config-rush --only @butshouldwe/fallow-rush --only @butshouldwe/sbom-rush
      # worktree-rush is intentionally not releasable until its public bundle
      # is fixed and this allowlist changes in a reviewed PR.
      - name: Pack and record exact release bytes
        id: pack
        run: |
          set -euo pipefail
          node scripts/release-npm.mjs pack "$RUNNER_TEMP/release" --repository "$GITHUB_REPOSITORY" \
            packages/config-rush \
            packages/fallow-rush \
            packages/sbom-rush
          echo "manifest=$(cat "$RUNNER_TEMP/release/manifest.json")" >> "$GITHUB_OUTPUT"
      - name: Inspect without uploading
        env:
          RELEASE_MANIFEST: ${{ steps.pack.outputs.manifest }}
        run: node scripts/release-npm.mjs publish "$RUNNER_TEMP/release" --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release
          path: ${{ runner.temp }}/release/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release
          path: ${{ runner.temp }}/release/
      - name: Publish inspected tarballs with OIDC, then read them anonymously
        env:
          RELEASE_MANIFEST: ${{ needs.build.outputs.manifest }}
        run: node scripts/release-npm.mjs publish "$RUNNER_TEMP/release"
